name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'scripts/profile/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'QiuYe-QAQ/QiuYe-QAQ' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check script syntax
        run: node --check scripts/profile/update-profile.mjs

      - name: Refresh public project data
        run: node scripts/profile/update-profile.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit changed profile content
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: README.md
          commit_message: UpData
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          skip_fetch: true
          skip_checkout: true
